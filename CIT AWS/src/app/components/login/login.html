<div class="contenedor-principal container d-flex justify-content-center align-items-center vh-100 ">
    <div class="card-container">
        <app-card-institucional>
            <span card-title><i class="bi bi-lock"></i> Acceso al sistema</span>
            <div>
                <img src="mapache_login.png" alt="Mapache-Login" class="img-fluid login-logo">
            </div>
            <div class="justify-content-center text-center">
                <h4 class="text-primary">Sistema de Control de Asistencia</h4>
                <p>Bienvenido, por favor inicie sesión</p>

                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mb-3">
                    <div class="mb-3 text-start">
                        <label class="form-label small text-secondary tracking-wider">Correo
                            Institucional</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i
                                    class="bi bi-envelope text-muted"></i></span>
                            <input formControlName="email" type="email" class="form-control bg-light shadow-none "
                                placeholder="nombre@chetumal.tecnm.mx">
                        </div>
                    </div>

                    <div class="mb-4 text-start">
                        <label class="form-label small text-secondary tracking-wider">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i
                                    class="bi bi-shield-lock text-muted"></i></span>
                            <input formControlName="password" [type]="mostrarPass() ? 'text' : 'password'" class="form-control bg-light shadow-none"
                                placeholder="••••••••">
                            <span class="input-group-text bg-light text-muted" style="cursor: pointer;"
                                (click)="mostrarPass.set(!mostrarPass())" tabindex="-1">
                                <i class="bi" [ngClass]="mostrarPass() ? 'bi-eye-slash' : 'bi-eye'"></i>
                            </span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-1"
                        [disabled]="loginForm.invalid">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
                    </button>

                    @if (errorLogin()) {
                    <div class="mt-2 animate__animated animate__headShake">
                        <small class="text-danger fw-bold d-flex align-items-center">
                            <i class="bi bi-excluir-circle me-1"></i> {{ errorLogin() }}
                        </small>
                    </div>
                    }
                </form>

                <div class="d-flex align-items-center my-4">
                    <hr class="flex-grow-1">
                    <span class="mx-3 text-muted">o</span>
                    <hr class="flex-grow-1">
                </div>

                <app-button-primary class="mb-2" (onClick)="loginGoogle()" [loading]="loadingGoogle()"
                    color="outline-primary" customClass="p-2 fw-bold">
                    <div class="d-flex align-items-center">
                        <div class="bg-white p-1 rounded me-3" style="line-height: 0;">
                            <img src="google-icon.svg" alt="Google" style="width: 18px; height: 18px;">
                        </div>
                        <span class="text-primary google">Continuar con Google</span>
                    </div>
                </app-button-primary>
                <span class="adv-accounts">¿No tienes cuenta? <a href="" class="text-decoration-none"
                        routerLink="/register">Registrate aquí</a></span>
            </div>
        </app-card-institucional>
    </div>

    <div class="dropdown position-fixed bottom-0 end-0 m-4">
        <button class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center" type="button"
            id="btnAccesibilidad" data-bs-toggle="dropdown" aria-expanded="false"
            style="width: 60px; height: 60px; z-index: 1050;">
            <i class="bi bi-palette-fill fs-2"></i>
        </button>

        <ul class="dropdown-menu dropdown-menu-end p-0 shadow-lg border-0 panel-configuracion">

            <div
                class="bg-primary text-white px-3 py-2 d-flex justify-content-between align-items-center rounded-top-custom">
                <span class="fw-bold fs-6 d-flex align-items-center gap-2 mb-0">
                    <i class="bi bi-sliders"></i> Panel de control
                </span>
                <button type="button" class="btn-close btn-close-white opacity-50" style="font-size: 0.6rem;"
                    aria-label="Close" onclick="document.body.click()"></button>
            </div>

            <div class="p-3 border-bottom border-light">
                <label class="form-label fw-bold text-dark mb-2 d-block fs-6">Tema</label>
                <div class="form-check form-switch d-flex align-items-center gap-2 ps-0 mb-0">
                    <div class="switch-custom-container">
                        <input class="form-check-input ms-0 mt-0" type="checkbox" id="darkModeSwitch"
                            (change)="toggleDarkMode()" [checked]="isDarkMode" role="switch" />
                    </div>
                    <label class="form-check-label d-flex align-items-center gap-1 mb-0" for="darkModeSwitch"
                        style="cursor: pointer;">
                        <i class="bi" [class.bi-moon-stars-fill]="isDarkMode" [class.bi-sun-fill]="!isDarkMode"></i>
                        {{ isDarkMode ? 'Modo oscuro' : 'Modo claro' }}
                    </label>
                </div>
            </div>

            <div class="p-3 border-bottom border-light">
                <label class="form-label fw-bold text-dark mb-2 d-block fs-6">Fuente</label>
                <select class="form-select custom-select shadow-none text-dark" (change)="changeFont($event)">
                    <option value="predeterminada" selected>Predeterminada</option>
                    <option value="'Arial', sans-serif">Arial</option>
                    <option value="'Roboto', sans-serif">Roboto</option>
                    <option value="'Times New Roman', serif">Times New Roman</option>
                </select>
            </div>

            <div class="p-3">
                <label class="form-label fw-bold text-dark mb-2 d-block fs-6">Tamaño de letra</label>
                <select class="form-select custom-select shadow-none text-dark" (change)="changeFontSize($event)">
                    <option value="small">Pequeño</option>
                    <option value="normal" selected>Mediano</option>
                    <option value="large">Grande</option>
                </select>
            </div>
        </ul>
    </div>
</div>
