<div class="d-flex align-items-center justify-content-center vh-100">
    <div class="text-center px-4">

        <div class="nf-number" aria-hidden="true">404</div>

        <div class="nf-icon mb-4">
            <i class="bi bi-compass"></i>
        </div>

        <h2 class="fw-bold mb-3 text-dark">Página no encontrada</h2>
        <p class="text-muted mb-4 mx-auto" style="max-width: 380px;">
            La dirección que ingresaste no existe o fue movida.<br>
            Verifica la URL o regresa al inicio.
        </p>

        <div class="d-flex gap-2 justify-content-center flex-wrap">
            <button (click)="irAlInicio()" class="btn btn-primary fw-semibold px-4 shadow-sm">
                <i class="bi bi-house-door-fill me-2"></i>Ir al inicio
            </button>

            <button (click)="irAlInicio()" class="btn btn-outline-secondary text-primary px-4 shadow-sm" style="border-color: #dee2e6;">
                <i class="bi bi-arrow-left me-2"></i>Volver atrás
            </button>
        </div>

        <p class="text-muted mt-5 mb-0" style="font-size: 0.75rem;">
            CIT · Sistema de Control de Asistencia
        </p>
    </div>
</div>
