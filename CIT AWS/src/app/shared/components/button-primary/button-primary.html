<button (click)="onClick.emit($event)"
        [type]="type()" 
        [class]="'btn btn-' + color() + ' w-100 d-flex align-items-center justify-content-center ' + customClass()"
        [disabled]="loading()">

    @if (!loading()) {
    <span>
        <ng-content></ng-content>
    </span>
    } @else {
    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
    }

</button>
