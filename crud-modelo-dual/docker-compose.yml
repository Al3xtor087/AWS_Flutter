version: '3.8'

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    # 🚀 El truco: -sharedDb le dice que comparta la BD entre regiones,
    # y -dbPath /data le dice que guarde los archivos en la carpeta del volumen
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    volumes:
      - ./docker_dynamodb_data:/data
    working_dir: /home/dynamodblocal

